method: "lstsq" # "cosine" 
model_path: "/home/ubuntu/dev/legalner-gliner2/output/deberta_base_ulysses_s0/best"
seed: 0 # matches "seed" in the model's experiment_config.json
dataset: "ulysses"  # or "lener"
batch_size: 8
max_length: 512
dataset_size: 1000
dataset_subset: "dev"
use_4bit: False
save_path: null
save_transform_only: True
diag: False # whether to force the LT to be a diagonal matrix
two_vectors: False # whether to force the LT to be a multiplication of two vectors
thri: False # whether to force the LT to be a lower triangular matrix
solver: "adam" # adam, cg, l-bfgs, trust-ncg are supported
loss: "cosine" # cosine, mse, elasticnet are supported
distances_path: null
num_A: 1 #  number of layer blocks to cut out. In total, up to num_A × layers_to_skip layers are removed
layers_to_skip: 6
merge_consecutive: True
accurate: False # False will run cosine(xA, y - z) where z is the residual attention info, True to run cosine(xA + z, y)
distance_calculation_tokens: "last_non_pad_token" # tokens distance profiling measures on. "first_sub_token": only tokens GLiNER2's head reads (word first sub-tokens + [E] markers). "last_non_pad_token": last non-pad token per sequence, as in the original ReplaceMe ([SEP] on DeBERTa)eval_subset: "test" # CoNLL split scored by the evaluator (calibration uses dataset_subset)
threshold: 0.5 # entity confidence threshold for batch_extract_entities
eval_size: null # optional cap on evaluated sentences